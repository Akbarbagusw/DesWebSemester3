<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="../login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota Baru</h2>
            <form method="POST" action="">
                <p>
                    <label for="nama">Nama Lengkap <span style="color: red;">*</span></label>
                    <input type="text" id="nama" name="nama_lengkap" required placeholder="Contoh: Siti Aminah">
                </p>
                <p>
                    <label for="no_anggota">No. Anggota <span style="color: red;">*</span></label>
                    <input type="text" id="no_anggota" name="no_anggota" required placeholder="Contoh: A004">
                </p>
                <p>
                    <label for="email">Alamat Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="email@contoh.com">
                </p>
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir">
                </p>
                <p>
                    <label for="jenis_kelamin">Jenis Kelamin</label>
                    <select id="jenis_kelamin" name="jenis_kelamin">
                        <option value="L">Laki-laki</option>
                        <option value="P">Perempuan</option>
                    </select>
                </p>
                <p>
                    <label for="no_hp">Nomor HP / WhatsApp <span style="color: red;">*</span></label>
                    <input type="tel" id="no_hp" name="no_hp" required placeholder="08xxxxxxxxxx">
                </p>
                <p>
                    <label for="alamat">Alamat Lengkap</label>
                    <textarea id="alamat" rows="3" name="alamat" placeholder="Jalan, RT/RW, Kota/Kabupaten"></textarea>
                </p>
                <p>
                    <button type="submit">Simpan Anggota</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4 (UI/UX Design)</p>
    </footer>
</body>
</html>
